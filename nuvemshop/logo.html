<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400&display=block" rel="stylesheet">
<style>*{margin:0}body{background:transparent}
.logo{width:575px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo b{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:150px;line-height:.82}
.logo i{font-style:normal;font-family:Montserrat,sans-serif;font-size:24px;letter-spacing:.55em;padding-left:.55em;margin-top:14px}
.claro b{color:#6E1F31}.claro i{color:#4A1421}
.escuro{background:#6E1F31}.escuro b{color:#D99BAA}.escuro i{color:#FBF1EE}
.fav{width:130px;height:130px;background:#6E1F31;display:grid;place-items:center}
.fav b{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:84px;color:#D99BAA;line-height:1;margin-top:-6px}
</style></head><body>
<div id="claro" class="logo claro"><b>KA</b><i>BRAND</i></div>
<div id="escuro" class="logo escuro"><b>KA</b><i>BRAND</i></div>
<div id="fav" class="fav"><b>KA</b></div>
</body></html>
